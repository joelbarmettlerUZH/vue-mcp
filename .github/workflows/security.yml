name: Security scan

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            build_target: server
            exit_code: "1"
          - name: ingestion
            build_target: ingestion
            exit_code: "1"
          - name: dashboard
            dockerfile: dashboard/Dockerfile
            context: dashboard
            build_target: runtime
            exit_code: "1"
          - name: postgres
            image: postgres:17-alpine
            exit_code: "0"
          - name: qdrant
            image: qdrant/qdrant:v1.19.2
            exit_code: "0"
          - name: traefik
            image: traefik:v3.6
            exit_code: "0"
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        if: matrix.build_target
        run: docker build -f ${{ matrix.dockerfile || 'Dockerfile' }} --target ${{ matrix.build_target }} -t scan-target:${{ matrix.name }} ${{ matrix.context || '.' }}

      - name: Resolve image ref
        id: ref
        run: echo "ref=${{ matrix.image || format('scan-target:{0}', matrix.name) }}" >> "$GITHUB_OUTPUT"

      # Our own images must stay clean; third-party images are report-only (we cannot patch them).
      - name: Trivy scan (fixable HIGH/CRITICAL only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: ${{ matrix.exit_code }}
